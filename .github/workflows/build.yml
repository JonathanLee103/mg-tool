name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller flask pandas openpyxl numpy xlrd

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name "MG数据生成工具" --add-data "generate_tables.py;." --hidden-import flask --hidden-import openpyxl --hidden-import pandas --hidden-import numpy --hidden-import xlrd web_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: MG数据生成工具
          path: dist/MG数据生成工具.exe
